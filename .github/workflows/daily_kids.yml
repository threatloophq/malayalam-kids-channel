name: Malayalam Kids Channel

on:
  schedule:
    - cron: '0 3 * * *'   # 8:30 AM IST daily
  workflow_dispatch:

jobs:
  create-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - run: sudo apt-get install -y ffmpeg

      - run: pip install -r requirements.txt

      - run: echo "${{ secrets.YOUTUBE_TOKEN_PICKLE }}" | base64 -d > token.pickle

      - name: Run pipeline
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          GH_TOKEN:          ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py

      - name: Update dashboard
        if: always()
        run: |
          git config user.name "Kids Bot"
          git config user.email "bot@github-actions"
          git add docs/status.json
          git diff --staged --quiet || git commit -m "chore: update status [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kids-video-${{ github.run_number }}
          path: output/video_final.mp4
          retention-days: 3
